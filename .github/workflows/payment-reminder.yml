name: Payment reminder

# The daily run is scheduled by Vercel Cron (vercel.json). This workflow is
# for manual runs and tests only.
on:
    workflow_dispatch:
        inputs:
            only_email:
                description: "Test: send only to this address (leave empty to send to everyone)"
                required: false
                default: ""
            date:
                description: "Test: pretend today is this date, YYYY-MM-DD (needs only_email)"
                required: false
                default: ""
            include_all:
                description: "Test: include every subscription, not only tomorrow's (needs only_email)"
                type: boolean
                required: false
                default: false

permissions: {}

jobs:
    send:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Trigger payment reminder job
              env:
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
                  ONLY_EMAIL: ${{ inputs.only_email }}
                  TEST_DATE: ${{ inputs.date }}
                  INCLUDE_ALL: ${{ inputs.include_all }}
              run: |
                  body=$(jq -n \
                    --arg onlyEmail "${ONLY_EMAIL:-}" \
                    --arg date "${TEST_DATE:-}" \
                    --arg includeAll "${INCLUDE_ALL:-false}" \
                    '{onlyEmail: $onlyEmail, date: $date, includeAll: ($includeAll == "true")}
                     | with_entries(select(.value != "" and .value != false))')
                  # Follow any domain redirect (e.g. apex -> www) first, so the
                  # POST and its Authorization header go to the final host.
                  url=$(curl -sS -o /dev/null -L -w '%{url_effective}' \
                    https://subflow.ing/api/cron/payment-reminder)
                  echo "Calling ${url}"
                  status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    -d "$body" \
                    --max-time 300 \
                    "$url")
                  cat response.txt; echo
                  if [ "$status" != "200" ]; then
                    echo "::error::Payment reminder returned HTTP ${status}"
                    exit 1
                  fi
